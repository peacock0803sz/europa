[package]
name = "europa-render"
version = "0.1.0"
edition = "2021"
description = "Rendering backend for Europa"
license = "MIT"

[dependencies]
europa-core = { path = "../europa-core" }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.49.0"
ratatui = { version = "0.30.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
