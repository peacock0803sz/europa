[package]
name = "europa-kernel"
version = "0.1.0"
edition = "2021"
description = "Kernel adapter for Europa"
license = "MIT"

[dependencies]
europa-core = { path = "../europa-core" }
getrandom = "0.4.3"
hmac = "0.13.0"
jupyter-protocol = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"

[dev-dependencies]
insta = "1.49.0"
tokio = { version = "1.53.3", features = ["rt", "macros"] }
