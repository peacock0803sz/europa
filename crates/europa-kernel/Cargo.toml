[package]
name = "europa-kernel"
version = "0.1.0"
edition = "2021"
description = "Kernel adapter for Europa"
license = "MIT"

[dependencies]
europa-core = { path = "../europa-core" }
getrandom = "0.4.3"
hmac = "0.13.0"
jupyter-protocol = "2"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "tcp-transport"] }

[dev-dependencies]
insta = "1.49.0"
