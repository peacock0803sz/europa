name: Check

on:
  push:
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: cargo test

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      # Keep the version in step with NBFORMAT_VERSION in scripts/nbformat-rewrite.sh.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install nbformat==5.10.4
      - name: Regenerate golden notebooks and expect no changes
        run: |
          bash scripts/nbformat-rewrite.sh golden
          test -z "$(git status --porcelain -- crates/europa-core/tests/fixtures/golden)"
          bash scripts/nbformat-rewrite.sh fixpoint
      - run: bash scripts/fetch-corpus.sh
      - run: bash scripts/nbformat-rewrite.sh corpus
      - run: EUROPA_CORPUS_DIR=target/europa-corpus cargo test -p europa-core --test corpus_load -- --ignored
      - run: EUROPA_JUPYTER_DIR=target/europa-corpus-jupyter cargo test -p europa-core --test corpus_write -- --ignored
